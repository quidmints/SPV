name: CI

# Regression guard for the QU!D monorepo:
#   - rust:     builds + runs the quid-ln workspace tests (29 proptests + units)
#   - solidity: forge build, the EIP-170 size gate, then forge test
#
# The bitcoind+electrs e2e (cargo --features harness) is intentionally NOT here;
# it downloads bitcoind/electrs and takes minutes. It lives in its own
# manual/optional workflow (.github/workflows/e2e-harness.yml).

# ⚠️ AUTOMATIC TRIGGERS DISABLED 2026-08-05 at the repo owner's request — failing runs were
#    flooding the inbox. Nothing fires on its own now; `workflow_dispatch` is kept so this can
#    still be run deliberately from the Actions tab (or `gh workflow run ci.yml`).
#
#    WHAT THIS COSTS, so re-enabling is a decision and not an afterthought: the solidity job runs
#    `forge build --sizes`, and that is the ONLY EIP-170 gate in the project — `forge test` does
#    NOT enforce the 24,576-byte limit. Core, Vogue and SwapLib all sit within a few hundred bytes
#    of the ceiling, so a contract can now go over it and nothing will say so until a deploy fails.
#    Until this is back on, run `forge build --sizes` by hand after touching those three.
#
#    TO RESTORE, delete this block and put back:
#      push:
#        branches: [main, master]
#      pull_request:
on:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust (quid-ln workspace)
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Cargo workspace root is quid-ln/ (its Cargo.toml lists the members
        # quid-ln, quid-hop, quid-bridge, ...). rust-toolchain.toml also lives here.
        working-directory: quid-ln
    steps:
      - uses: actions/checkout@v4
        with:
          # The LDK fork is vendored in-tree (lib/rust-lightning), not a
          # submodule, so a normal checkout is sufficient. submodules: false is
          # the default; left explicit for clarity.
          submodules: false

      # Pin the EXACT toolchain the repo uses. rust-toolchain.toml pins
      # stable 1.90.0 (+ clippy, rustfmt, minimal profile); dtolnay's action
      # honours that file automatically, but we name it to be unambiguous and to
      # fail loudly if the file ever drifts.
      - name: Install Rust 1.90.0 (matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@1.90.0

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: quid-ln

      # Plain build of the whole workspace. NO via_ir / optimizer concerns here
      # (that constraint is the Solidity side); we just must not pass --features
      # harness, which would pull electrsd's bitcoind/electrs download surface.
      - name: cargo build (workspace)
        run: cargo build --workspace --locked

      # Runs every unit test + the 29 proptests across the workspace. The
      # bitcoind/electrs e2e is `#![cfg(feature = "harness")]`, so WITHOUT the
      # feature it compiles to nothing and is skipped here — exactly what we want
      # for a fast default job.
      - name: cargo test (workspace, no harness)
        run: cargo test --workspace --locked

      # §FUZZ-WAS-DEAD — the step above CANNOT see the fuzz crate. `quid-hop/fuzz` is in the
      # workspace `exclude` list (detached nightly + sanitizer), so a fuzz target importing a
      # DELETED module fails nothing: `lp_auth.rs` referenced `quid_hop::lp_auth` for three weeks
      # after §E183 removed it, with every cargo test green, and it was the repo's only target.
      # A reference check, not a compile — needs no nightly and no cargo-fuzz, which is exactly why
      # it can run here. A stronger check CI cannot install is worth less than a weak one it runs.
      # ⚠️ RESTORED 2026-08-22: this step and its script were deleted by `48244397`, an E308 commit
      # about load-balance consent whose message never mentions either. Swept in, unannounced.
      - name: fuzz targets still reference live symbols
        run: python3 tools/check-fuzz-targets.py

  solidity:
    name: solidity (evm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # forge libs (v4-core, solady, ...) are submodules

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # foundry.toml deliberately keeps via_ir = false (optimizer on, 200 runs).
      # Do not change that here.
      - name: forge build
        run: forge build

      # HARD EIP-170 size gate — the regression guard the team flagged as
      # missing. forge's own test EVM does NOT enforce the 24,576-byte runtime
      # limit, so an oversize (undeployable) contract would otherwise pass the
      # whole suite. This script parses `forge build --sizes --json` and FAILS
      # the job if any contract's runtime bytecode exceeds the limit.
      - name: EIP-170 size gate
        run: ./scripts/ci/check-sizes.sh

      # §BUILT-BUT-UNWIRED — an interface member nothing in evm/src calls. Invisible to `forge
      # build` and `forge test` (the name is there; the CALLER is missing), and CLAUDE.md's rule
      # for it had already failed once at exactly this, which is why it is a gate and not a rule.
      - name: interface members have a production caller
        run: python3 tools/check-orphans.py

      - name: forge test
        run: forge test
