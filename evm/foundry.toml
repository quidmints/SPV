
[profile.default]
src = "src"
out = "out"

libs = ["lib"]
ffi = true

# Remappings live in `remappings.txt` (the standard location every solc-based tool reads: IDEs,
# slither/crytic, plain solc). There is deliberately NO `remappings = [...]` here — having BOTH is
# what caused the bug this comment used to record: the two lists had DIVERGED (remappings.txt mapped
# the broad `@openzeppelin/`, this mapped the narrow `@openzeppelin/contracts/`) and forge MERGES the
# auto-detected file with an explicit list, which is how the base `@openzeppelin/` mapping got dropped
# once `@openzeppelin/contracts-upgradeable/` was added, breaking every @openzeppelin/contracts import.
# ONE list, in the conventional file, no merge to go wrong.
#
# Four entries were dropped while consolidating, each provably dead (0 refs in src/ or test/, 0
# TRANSITIVE imports in any compiled lib source, and 3 of 4 pointed at paths absent from disk):
#   @ensdomains/ (we do nothing with ENS) · hardhat/ · ds-test/ · erc4626-tests/
# `openzeppelin-contracts/` was KEPT — it has 3 transitive imports inside compiled lib sources, so it
# is load-bearing even though src/ never names it directly.

gas_reports = ["*"]
fs_permissions = [
    { access = "read-write", path = ".forge-snapshots/"},
    { access = "read-write", path = "src/contracts/"},
    { access = "read-write", path = "deployments/"},
    { access = "read-write", path = "./"}
]

solc_version = "0.8.30"
evm_version = "cancun"
# ─── FORK RPC: configured in `evm/.env` (gitignored), NEVER in this file ───────────────────────
# There is deliberately NO `eth_rpc_url` key here.
#   • It cannot be made safe by interpolation: Foundry does NOT expand ${VAR} in `eth_rpc_url` — it
#     passes the literal string through and the fork dies with "could not instantiate forked
#     environment" (verified 2026-08-02, both via .env and via an explicit export).
#   • It does not need to be: Foundry reads the `ETH_RPC_URL` env var natively and auto-loads
#     `evm/.env`, so `forge test` forks correctly with this key absent.
#   • `rpc_endpoints` below DOES interpolate, so it uses ${ETH_RPC_URL}.
# ⚠️ HISTORY: this line previously held an Ankr URL with the API TOKEN IN PLAINTEXT, in a repo with a
#   public-snapshot commit (0af7f6d). That token (…d14cbfc3) must be treated as DISCLOSED and rotated —
#   removing it from HEAD does not un-leak git history. Never inline a keyed URL here again.
# Keyless fallback if you have no .env: ETH_RPC_URL=https://ethereum-rpc.publicnode.com

# ⚠️ `via_ir = false` STAYS, AND THE REASON IS MEASURED, NOT PREFERENCE (2026-08-19). A global
# `via_ir = true` + `optimizer_runs = 50` was tried so the vendored Midnight sources would need no
# per-path profile. It FAILS: solc dies with "Cannot swap Variable expr_7 ... too deep in the stack
# by 4 slots" on `test/Alles.t.sol:641`, a large `DeployLib.StackConfig({...})` literal, and names
# the cause — "No memoryguard was present. Consider using memory-safe assembly only".
# There are 15 unannotated `assembly {` blocks in src/ + test/; each one disables via_ir's memory
# optimisation for its unit, and the stack then runs out on ordinary struct construction.
# ⇒ Making the global setting work means asserting `assembly ("memory-safe")` on all 15. That
# annotation is a PROMISE to the optimiser: if any block touches memory outside the Solidity model,
# the result is SILENT MISCOMPILATION on a money path. Not worth it to remove one config block.
via_ir = false
optimizer = true
optimizer_runs = 200
dynamic_test_linking = true

bytecode_hash = "none"
deny_warnings = false
cbor_metadata = false
sparse_mode = false
build_info = true

# Echidna/crytic profile — inherits default, DISABLES dynamic test linking.
#
# WHY: with `dynamic_test_linking = true` (the default profile, above) forge emits VIRTUAL source
# units for its test preprocessor — `foundry-pp/DeployHelper<N>.sol`, `VmContractHelper<N>` — which
# exist only inside build-info, never on disk. crytic-compile then tries to OPEN them as real files
# and dies with `Unknown file: foundry-pp/DeployHelper224.sol`, so Echidna reports "Couldn't compile
# given file" (while still exiting 0 — the failure is easy to miss). Verified 2026-07-26: flipping
# this off makes `crytic-compile . --foundry-compile-all` succeed on the whole tree, tests included.
#
# Use:  FOUNDRY_PROFILE=echidna echidna . --contract <Harness> --config echidna.yaml
[profile.echidna]
dynamic_test_linking = false

[rpc_endpoints]
# forge script scripts/DeployL1.s.sol:Deploy --rpc-url mainnet --broadcast --verify
mainnet = "${ETH_RPC_URL}"

[etherscan]
mainnet = { key = "${ETHERSCAN_L1}" }

[profile.dependencies]
# (§V4-CUT, completed 2026-08-18) `v4-core` and `v4-periphery` are DELETED from here. The cut
# removed every import, type and remapping — verified: zero non-comment references to `v4-core`,
# `v4-periphery`, `IPoolManager`, `PoolKey`, `BalanceDelta` or `Currency` anywhere in `src`, `test`
# or `script`, and no `v4` line in `remappings.txt` — but these two DECLARATIONS survived the cut in
# a committed file, so every fresh checkout still fetched ~70 MB of Uniswap v4 to satisfy a
# dependency nothing imports. Worse than dead weight: while the trees are present, a stray import or
# an alias can still RESOLVE into them, so the cut is only enforceable once they cannot be found.
solady = { git = "https://github.com/Vectorized/solady" }

# ─── MIDNIGHT (Morpho Blue v2) — VENDORED SOURCES, COMPILED AT THEIR OWN SETTINGS ──────────────
# An EXPLICIT FILE LIST, not a directory glob, and not the whole tree. These are Midnight sources
# (morpho-org/morpho-v2 @ 709dab35, see src/imports/MIDNIGHT-FORK.md) sitting in `src/imports/`
# beside our own libraries. They need settings our tree does not use:
#   • `via_ir = true` — Midnight does NOT compile without it ("Stack too deep", LValue.cpp:54, at
#     every optimizer_runs value). Measured.
#   • `optimizer_runs = 50` — the only value it fits EIP-170 at, and the curve is NOT monotonic:
#     1 -> 24,508 | 50 -> 24,469 | 200 -> 24,650 | 466 -> 24,720.
# Widening this to `src/imports/**` would re-optimise LevMath, SwapLib and BasketLib at 50 runs and
# flip via_ir for the whole money path. Add a file here when vendoring another Midnight source.
[[profile.default.compilation_restrictions]]
paths = "src/imports/{Midnight,ConstantsLib,EventsLib,IdLib,SafeTransferLib,TickLib,UtilsLib,HashLib,SetterRatifier,EcrecoverRatifier,ICallbacks,IERC20,IGate,IMidnight,IOracle,IRatifier,IEcrecoverRatifier,ISetterRatifier}.sol"
via_ir = true
optimizer_runs = 50

# A `compilation_restrictions` entry only CONSTRAINS; it does not CREATE a profile. Without this
# the build fails with "Missing profile satisfying settings restrictions for src/imports/Midnight.sol".
# Keep the two blocks in sync — same via_ir, same optimizer_runs.
[[profile.default.additional_compiler_profiles]]
name = "midnight-viair-50"
via_ir = true
optimizer_runs = 50
