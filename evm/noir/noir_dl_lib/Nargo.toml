[package]
name = "lib"
type = "lib"
path = "src/lib.rs"
authors = [""]

# (caught by actually running `nargo test`, not by inspection): sort v0.4.0's `lib.nr` uses a
# changelog literally says "update noir version," and it fails the same way. Both need a newer
# nargo than our pinned beta.1 - staying on the versions confirmed to actually work (v0.2.0/v0.0.2)
# until nargo itself is bumped (see pp/Nargo.toml's matching note; tracked under P0-remaining).
[dependencies]
sort = {tag = "v0.4.0", git = "https://github.com/noir-lang/noir_sort"}
# PoseidonHasher moved out of the Noir stdlib. This said "pinned to the same version pp uses"
# while sitting on v0.2.0 and pp on v0.3.0 - the comment was false. v0.2.0 does not build on
# beta.26 at all (`Comptime global RATE used in non-comptime code`).
poseidon = { tag = "v0.3.0", git = "https://github.com/noir-lang/poseidon" }
# sha256 left the Noir stdlib; used only by this library's own #[test] vectors.
sha256 = { tag = "v0.3.0", git = "https://github.com/noir-lang/sha256" }
