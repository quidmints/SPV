# =============================================================================
# QU!D production bitcoin.conf — HARDENED, ANTI-ECLIPSE posture
# =============================================================================
#
# This is the chain source for the QU!D hop/bridge: the self-hosted Bitcoin Core
# full node that esplora-electrs indexes and that the LDK node / SPV relayer
# trust for headers, merkle proofs, and broadcast. Because the protocol's BTC
# security ultimately rests on what this node believes is the best chain, the
# residual risk is a P2P ECLIPSE: an attacker who monopolises all of this node's
# peer connections can feed it a fake/withheld view of the chain (stale tip,
# censored funding/close txs, forged confirmations against a low-work fork).
#
# Every setting below is chosen to make eclipse hard and is commented with its
# rationale. Two settings the operator MUST customise before production are
# flagged with `### OPERATOR ACTION REQUIRED ###`:
#   1. `asmap=`  — supply a real asmap file (strongest anti-eclipse measure).
#   2. `addnode=` — supply real trusted persistent peers.
# See ops/README.md for the full rationale and setup steps.
#
# NOTE: This is a PRODUCTION mainnet artifact. The regtest test harness
# (quid_hop::harness) launches its own bitcoind with its own config — leave that
# alone; regtest has no peers and no eclipse concern.

# -----------------------------------------------------------------------------
# Network: mainnet
# -----------------------------------------------------------------------------
chain=main

# -----------------------------------------------------------------------------
# ANTI-ECLIPSE #1 — asmap (ASN bucketing of addrman)   *** STRONGEST DEFENSE ***
# -----------------------------------------------------------------------------
# Bitcoin Core's address manager (addrman) buckets peer addresses to limit how
# many a single source can occupy. By default it buckets by /16 IP prefix, which
# an attacker controlling many IPs across a few /16s (cheap on cloud) can still
# flood. `asmap` instead buckets by Autonomous System Number (ASN), so filling
# buckets requires control of many DISTINCT networks — dramatically raising the
# cost of an eclipse. This is the single most effective anti-eclipse measure.
#
# ### OPERATOR ACTION REQUIRED ###
# Supply a real asmap file. Bitcoin Core ships the tooling and the canonical map
# lives in the bitcoin/bitcoin repo at contrib/asmap; built/maintained dumps are
# published by the project and the asmap-data repo
# (https://github.com/fjahr/asmap-data / contrib/asmap in Core). Place the file
# next to this config and point at it here. A RELATIVE path is resolved against
# the datadir; an absolute path is used as-is. If the file is missing, bitcoind
# refuses to start (fail-closed) — that is intentional.
asmap=asmap.dat

# -----------------------------------------------------------------------------
# ANTI-ECLIPSE #2 — outbound peer diversity + anchors
# -----------------------------------------------------------------------------
# Core makes 8 full-relay + 2 block-relay-only outbound connections by default
# and diversifies them across network groups. Do NOT use `connect=` (see the big
# warning below) — that would disable this. We keep the defaults and add headroom.

# Block-relay-only ANCHOR connections persist across restarts: on shutdown Core
# writes its 2 block-relay-only peers to anchors.dat and reconnects to them on
# the next start. This means a restart cannot be used to shake the node onto a
# fresh (attacker-seeded) peer set — it re-anchors to known-good block sources.
# Anchors are ON BY DEFAULT since v0.21; we set this explicitly to document the
# posture and guard against it being turned off elsewhere.
# (`0` would DISABLE anchors — do not do that.)
maxconnections=125

# Keep outbound block-relay-only / full-relay automatic peer selection enabled.
# (These are Core defaults; listed for clarity — there is no knob to "turn on"
# anchors beyond not disabling them, and there is no `connect=`.)

# -----------------------------------------------------------------------------
# ANTI-ECLIPSE #3 — persistent trusted peers via addnode (NOT connect)
# -----------------------------------------------------------------------------
# `addnode` adds PERSISTENT, manually-trusted peers that Core keeps trying to
# reach IN ADDITION to its automatic peer discovery. Pinning a few known-good
# peers (your own other nodes, a partner's node, a well-known reliable node)
# gives the node a stable honest anchor that an addrman-flooding attacker cannot
# displace.
#
# ### OPERATOR ACTION REQUIRED ###
# Replace the placeholders below with REAL peers you trust — ideally:
#   - your organisation's OTHER bitcoind nodes (different ASN/region if possible),
#   - a partner/known-good node operator,
#   - optionally a node reachable over Tor (.onion) for path diversity.
# Use 2–4. Diversity across ASNs/regions matters more than count.
#addnode=YOUR-OTHER-NODE-1.example.com:8333
#addnode=YOUR-OTHER-NODE-2.example.com:8333
#addnode=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx.onion:8333
#
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!! DO NOT USE connect= !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!
# `connect=<peer>` makes Core talk ONLY to the listed peers and DISABLES all
# automatic peer discovery (DNS seeds, addr gossip, anchors). That is the exact
# opposite of what we want: if those few peers are malicious or compromised, the
# node is trivially and TOTALLY eclipsed with no honest fallback. Never use
# `connect=` for this node. Use `addnode=` (additive) only.
# !!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!!

# -----------------------------------------------------------------------------
# ANTI-ECLIPSE #4 — keep peer discovery sources ON
# -----------------------------------------------------------------------------
# DNS seeds + addr-gossip-based discovery give the node a wide, independent view
# of the network so it can heal its peer set. These are Core defaults; we set
# them explicitly so nobody "hardens" the node into isolation by turning them
# off. Disabling discovery is an eclipse FOOTGUN, not a hardening step.
dns=1
dnsseed=1

# Accept inbound connections + advertise our address. Inbound peers add to peer
# diversity and let honest nodes reach us. Pair with the firewall/port-forward
# for tcp/8333 in your deployment.
listen=1
# discover=1 (default) lets Core learn and advertise its own public address.
discover=1

# -----------------------------------------------------------------------------
# electrs / esplora indexing requirements
# -----------------------------------------------------------------------------
# The hop runs esplora-electrs against this node. electrs needs:
#   - RPC enabled (server=1) so it can call bitcoind, and
#   - the full transaction index (txindex=1) so any txid is retrievable, which
#     electrs relies on while building its own address/script index.
server=1
txindex=1

# RPC binding + auth. Bind to loopback only (electrs runs on the same host).
# Generate the rpcauth line with Core's share/rpcauth/rpcauth.py and put the
# resulting `rpcauth=user:salt$hash` here; keep the cleartext password OUT of
# this file and out of git. (Placeholder shown — replace before production.)
rpcbind=127.0.0.1
rpcallowip=127.0.0.1
#rpcauth=quid:REPLACE_WITH_OUTPUT_OF_rpcauth.py

# ZMQ notifications — fast block/tx push for electrs / downstream followers.
# Loopback only. (electrs can poll RPC instead, but ZMQ lowers latency.)
zmqpubrawblock=tcp://127.0.0.1:28332
zmqpubrawtx=tcp://127.0.0.1:28333
zmqpubhashblock=tcp://127.0.0.1:28334

# -----------------------------------------------------------------------------
# Resource / DoS hygiene
# -----------------------------------------------------------------------------
# Cap monthly upload so a few greedy peers can't saturate the link and starve
# the connections we depend on. 1 GiB/day-ish; tune to your bandwidth. The node
# still always serves recent blocks + headers/tx relay regardless of this cap,
# so it does not weaken our own chain following.
maxuploadtarget=5000

# Disable BIP37 bloom filters: they are a remote-DoS / privacy footgun and we
# do not serve light SPV clients off this node (esplora indexes locally).
peerbloomfilters=0
# We also do not serve BIP157/158 compact filters to peers (esplora builds its
# own indexes); leave the server off to reduce attack surface.
peerblockfilters=0

# Generous mempool + dbcache for a server node (tune to host RAM). A healthy
# mempool helps fee estimation for the hop's CPFP/anchor bumps.
dbcache=2048
maxmempool=600

# Keep the full chain (no pruning) — txindex=1 requires it and electrs needs the
# full history. (prune=0 is the default; stated for clarity.)
prune=0

# -----------------------------------------------------------------------------
# Logging / ops
# -----------------------------------------------------------------------------
# Surface peer/net events so an eclipse-in-progress (sudden peer churn, all-one-
# ASN inbound) is visible in logs and your monitoring.
debug=net
# Timestamps + thread names make the net log auditable.
logips=1
logtimestamps=1
