# cargo-fuzz scaffold for quid-hop's UNTRUSTED-input parsers.
#
# This is a DETACHED workspace (its own `[workspace]` table below) so it isn't
# pulled into the main build / `cargo test`; libFuzzer needs a nightly toolchain
# and `cargo install cargo-fuzz`, which the normal CI step does not have.
#
# Run (after `cargo install cargo-fuzz`):
#   cd quid-hop/fuzz && cargo +nightly fuzz run heartbeat
# See README.md.

[package]
name = "quid-hop-fuzz"
version = "0.0.0"
edition = "2021"
publish = false
license = "PolyForm-Noncommercial-1.0.0"

[package.metadata]
cargo-fuzz = true

# Detach from the parent workspace: a cargo-fuzz crate builds with its own
# (nightly) toolchain + sanitizer flags and must not become a member of the
# `quid-ln` workspace.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
quid-hop = { path = ".." }
alloy-primitives = "0.8"
bitcoin = "0.32.7"

# ⚠️ (2026-08-22) WAS `lp_auth`, WHICH FUZZED A MODULE §E183 HAD DELETED. This crate is
# `exclude`d from the parent workspace, so a target importing a nonexistent module NEVER FAILED A
# BUILD — the repo's only fuzz target was dead and nothing could report it. If you add a target
# here, add it to CI or it will rot the same way.
[[bin]]
name = "heartbeat"
path = "fuzz_targets/heartbeat.rs"
test = false
doc = false
bench = false

# The LDK dep is the vendored fork (patched for the channel_funding_pubkeys
# accessor). This detached workspace must re-declare the same [patch] the parent
# Cargo.toml carries, or quid-hop won't compile here. Paths are relative to this
# fuzz crate (quid-hop/fuzz/ → ../../lib/rust-lightning).
[patch.crates-io]
lightning = { path = "../../lib/rust-lightning/lightning" }
lightning-invoice = { path = "../../lib/rust-lightning/lightning-invoice" }
lightning-transaction-sync = { path = "../../lib/rust-lightning/lightning-transaction-sync" }
lightning-types = { path = "../../lib/rust-lightning/lightning-types" }
