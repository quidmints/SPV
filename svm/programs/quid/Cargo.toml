
[package]
name = "quid"
version = "0.1.0"
description = ""
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "quid"

[features]
# LayerZero testnet EIDs (Solana devnet 40168 / Sepolia 40161) in place of
# mainnet (30168 / 30101). See the note in LZ.rs.
testnet = []
default = []
testing = []

cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
phf = { version = "0.13.1", features = ["macros"] }
anchor-lang = { version = "0.32.1", features=["init-if-needed"] }
rust_decimal = { version = "1.32", default-features = false }
anchor-spl = "0.32.1"

[dev-dependencies]
# Test-only. `solana-program` used to be a full dependency for exactly one
# `hash()` call inside a #[test]; anchor's `solana_program` re-export does not
# carry `hash`, and pulling the whole crate back in for a test drags a second
# major version of it into the graph. This is the one subcrate that call needs.
solana-sha256-hasher = "2.3"
